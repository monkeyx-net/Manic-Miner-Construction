<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Manic Miner</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; touch-action: none; }
    canvas#canvas { display: block; image-rendering: pixelated; }

    #controls { display: none; position: fixed; inset: 0; pointer-events: none; z-index: 10; }

    .ctrl-btn {
      position: absolute;
      pointer-events: all;
      background: rgba(255,255,255,0.15);
      border: 2px solid rgba(255,255,255,0.4);
      border-radius: 50%;
      color: rgba(255,255,255,0.8);
      font-size: 28px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
      width: 72px;
      height: 72px;
    }
    .ctrl-btn:active { background: rgba(255,255,255,0.35); }

    #ctrl-left  { bottom: 24px; left: 24px; }
    #ctrl-right { bottom: 24px; left: 112px; }
    #ctrl-jump  { bottom: 24px; right: 24px; width: 88px; height: 88px; font-size: 36px; }
    #ctrl-enter { bottom: 120px; right: 24px; }
    #ctrl-pause { top: 16px; right: 104px; width: 52px; height: 52px; font-size: 20px; border-radius: 8px; }
    #ctrl-esc   { top: 16px; right: 40px;  width: 52px; height: 52px; font-size: 20px; border-radius: 8px; }
  </style>
</head>
<body>
  <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>

  <div id="controls">
    <div class="ctrl-btn" id="ctrl-left">&#9664;</div>
    <div class="ctrl-btn" id="ctrl-right">&#9654;</div>
    <div class="ctrl-btn" id="ctrl-jump">&#9650;</div>
    <div class="ctrl-btn" id="ctrl-enter">&#9166;</div>
    <div class="ctrl-btn" id="ctrl-pause">&#9646;&#9646;</div>
    <div class="ctrl-btn" id="ctrl-esc">&#10005;</div>
  </div>

  <script>
    var canvas = document.getElementById('canvas');

    function sendKey(type, key, code) {
      canvas.dispatchEvent(new KeyboardEvent(type, {
        key: key, code: code, keyCode: 0,
        bubbles: true, cancelable: true
      }));
    }

    function bindBtn(id, key, code) {
      var el = document.getElementById(id);
      el.addEventListener('touchstart', function(e) {
        e.preventDefault();
        sendKey('keydown', key, code);
      }, {passive: false});
      el.addEventListener('touchend', function(e) {
        e.preventDefault();
        sendKey('keyup', key, code);
      }, {passive: false});
      el.addEventListener('touchcancel', function(e) {
        sendKey('keyup', key, code);
      }, {passive: false});
    }

    bindBtn('ctrl-left',  'ArrowLeft',  'ArrowLeft');
    bindBtn('ctrl-right', 'ArrowRight', 'ArrowRight');
    bindBtn('ctrl-jump',  ' ',          'Space');
    bindBtn('ctrl-enter', 'Enter',      'Enter');
    bindBtn('ctrl-pause', 'Tab',        'Tab');
    bindBtn('ctrl-esc',   'Escape',     'Escape');

    var isAndroid = /android/i.test(navigator.userAgent);
    var isTouch   = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
    if (isAndroid || isTouch) {
      document.getElementById('controls').style.display = 'block';
    }

    var Module = {
      canvas: canvas,
      onRuntimeInitialized: function() { canvas.focus(); }
    };
  </script>
  <script async type="text/javascript" src="index.js"></script>
</body>
</html>
